
[package]
name = "yolov11_inference_rust"
version = "0.1.0"
edition = "2021"

[dependencies]

openvino = { version = "0.7.1", features = ["runtime-linking"] }
opencv = "0.94"
tokio = { version = "1.0", features = ["full"] }
postgres = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }

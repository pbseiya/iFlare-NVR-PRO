version: '3.8'

services:
  # Note: Using existing shared_postgres container on host
  # Database: yolov11_inference (already created)
  # Connection: localhost:5432, User: admin, Password: password

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yolov11_backend
    environment:
      DATABASE_URL: postgresql://admin:password@host.docker.internal:5432/yolov11_inference
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./videos:/app/videos
      - ./backend:/app:ro
    networks:
      - yolov11_network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Configuration Web UI
  config_ui:
    build:
      context: ./web-ui/config
      dockerfile: Dockerfile
    container_name: yolov11_config_ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    networks:
      - yolov11_network
    restart: unless-stopped
    depends_on:
      - backend

  # NVR Web UI
  nvr_ui:
    build:
      context: ./web-ui/nvr
      dockerfile: Dockerfile
    container_name: yolov11_nvr_ui
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    networks:
      - yolov11_network
    restart: unless-stopped
    depends_on:
      - backend

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yolov11_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yolov11.local
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - yolov11_network
    restart: unless-stopped
    profiles:
      - dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgadmin_data:
    driver: local

networks:
  yolov11_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
